---
- name: Hot-Add CPU to a running VM in vCenter
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Ensure the community.vmware collection is installed
      ansible.builtin.meta: flush_handlers

    - name: Connect to vCenter
      community.vmware.vmware_host:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no

    - name: Hot-Add CPU to the VM
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no
        name: "{{ vm_name }}"
        datacenter: "{{ datacenter_name }}"
        cluster: "{{ cluster_name }}"
        state: poweredon
        hardware:
          num_cpus: "{{ new_cpu_count }}"  # Update the CPU count
        hotadd_enabled: true  # Ensures hot-add feature is enabled
        cpu_hot_add_enabled: true  # Enable CPU hot-add

    - name: Verify the CPU hot-add has been applied
      community.vmware.vmware_guest_facts:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no
        name: "{{ vm_name }}"
      register: vm_facts

    - name: Display updated CPU count
      ansible.builtin.debug:
        msg: "New CPU count is: {{ vm_facts.virtual_machines[0].guest.num_cpus }}"
