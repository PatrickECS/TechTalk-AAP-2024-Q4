---
- name: create vm 
  hosts: localhost
  become: false
  gather_facts: false
  

  
  tasks:
    - name: create folder
      community.vmware.vcenter_folder:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        folder_name: "{{ vcenter_parent_folder }}/{{ vcenter_subfolder }}"
        folder_type: vm
        state: present
    - name: Debug Folder Creation
      debug:
        msg: "Folder '{{ vcenter_subfolder }}' created in datacenter '{{ vcenter_datacenter }}'."
