---
- name: Deploy Folder and Default Resource Pool in VMware
  hosts: localhost
  become: false
  gather_facts: true

  tasks:
    - name: Create Folder in VMware Datacenter
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ folder_name }}"
        state: present

    - name: Debug Folder Creation
      debug:
        msg: "Folder '{{ folder_name }}' created in datacenter '{{ vcenter_datacenter }}'."

    - name: Create a Default Resource Pool in VMware Cluster
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no
        cluster_name: "{{ vcenter_cluster }}"
        resource_pool: "{{ resource_pool_name }}"
        cpu_expandable: true
        cpu_limit: -1                # -1 indicates no limit
        cpu_reservation: 0           # No reservation
        cpu_share_level: normal      # Default CPU share level
        mem_expandable: true
        mem_limit: -1                # -1 indicates no limit
        mem_reservation: 0           # No reservation
        mem_share_level: normal      # Default memory share level
        state: present

    - name: Debug Resource Pool Creation
      debug:
        msg: "Resource pool '{{ resource_pool_name }}' created in cluster '{{ vcenter_cluster }}' with default settings."
