---
- name: Change address
  hosts: Fortigate-Ansible-Demo
  connection: ssh
  gather_facts: no

  tasks:
    - name: Create Address
      fortinet.fortios.fortios_firewall_address:
        username: "{{ ansible_user }}"     # Username for SSH
        password: "{{ ansible_password }}" # Password for SSH login
        state: "present"
        firewall_address:
          name: '{{ address_name }}'
          subnet: "{{ subnet }}"

    - name: Debug message after address creation
      debug:
        msg: "Address '{{ address_name }}' with subnet '{{ subnet }}' has been successfully created or updated."
