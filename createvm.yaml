---
- name: Create a VM in VMware vSphere
  hosts: localhost
  gather_facts: no
  collections:
    - vmware.vmware_rest
  tasks:
    - name: Connect to vCenter
      vmware.vmware_rest.rest_login:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no

    - name: Create a new VM
      vmware.vmware_rest.vcenter_vm:
        name: "{{ vm_name }}"
        guest_OS: "{{ guest_id }}"
        placement:
          cluster: "{{ cluster_name }}"
          datastore: "{{ datastore_name }}"
        hardware:
          memory: "{{ memory_mb }}"
          cpus: "{{ num_cpus }}"
        disks:
          - type: "thin"
            value: "{{ disk_size_gb }}"
        nics:
          - network_name: "{{ vm_network_name }}"
            start_connected: true

    - name: Power on the VM
      vmware.vmware_rest.vcenter_vm_power:
        id: "{{ vm_name }}"
        state: "powered_on"
