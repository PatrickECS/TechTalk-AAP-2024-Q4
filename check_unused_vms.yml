---
- name: Find unused VMs in vCenter
  hosts: localhost
  gather_facts: false
  collections:
    - community.vmware

  vars:
    vcenter_hostname: "your-vcenter.local"
    vcenter_username: "administrator@vsphere.local"
    vcenter_password: "yourpassword"
    vcenter_validate_certs: false
    vcenter_datacenter: "YourDatacenter"

  tasks:

    - name: Gather all VMs from vCenter
      vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      register: vm_info

    - name: Show basic VM info
      debug:
        msg: |
          VM: {{ item.name }}
          Power State: {{ item.power_state }}
          Guest OS: {{ item.guest_name }}
          Boot Time: {{ item.boot_time | default('N/A') }}
      loop: "{{ vm_info.virtual_machines }}"
