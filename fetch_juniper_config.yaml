---
- name: Fetch Junos Running Configuration
  hosts: Juniper-Switch
  gather_facts: no
  connection: network_cli 

  tasks:
    - name: Display running configuration
      junipernetworks.junos.junos_command:
        commands:
          - show configuration | display set
      register: running_config

    - name: Display the full configuration output
      debug:
        msg: "{{ running_config.stdout[0] }}"
