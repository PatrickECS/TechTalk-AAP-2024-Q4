---
- name: Add user to Active Directory and assign to group
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Ensure user exists in Active Directory
      community.microsoft.win_domain_user:
        name: "{{ username }}"
        password: "{{ password }}"
        firstname: "{{ first_name }}"
        lastname: "{{ last_name }}"
        user_ou: "{{ user_ou }}"
        state: present
      register: user_creation

    - name: Add user to specified AD group
      community.microsoft.win_domain_group_membership:
        name: "{{ user_group }}"
        members:
          - "{{ username }}"
        state: present
      when: user_creation.changed  # Only adds to group if the user was created or modified
      register: group_addition

    - name: Display success message
      debug:
        msg: "User '{{ username }}' has been successfully added to the OU '{{ user_ou }}' and the group '{{ user_group }}'."
      when: group_addition.changed  # Only displays if the user was added to the group
