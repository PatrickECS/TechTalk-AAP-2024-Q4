- name: Ensure user Bob is present with address information
  hosts: localhost 
  

  tasks:
    - name: Ensure user Bob is present with address information
      microsoft.ad.user:
        identity: "{{ user_identity }}"
        firstname: "{{ user_firstname }}"
        surname: "{{ user_surname }}"
        company: "{{ user_company }}"
        password: "{{ user_password }}"
        state: present
        groups:
          set: "{{ user_groups }}"
        street: "{{ user_street }}"
        city: "{{ user_city }}"
        state_province: "{{ user_state_province }}"
        postal_code: "{{ user_postal_code }}"
        country: "{{ user_country }}"
        attributes:
          set:
            telephoneNumber: "{{ user_telephone }}"

    - name: Ensure user Bob is created and use custom credentials to create the user
      microsoft.ad.user:
        identity: "{{ user_identity }}"
        firstname: "{{ user_firstname }}"
        surname: "{{ user_surname }}"
        password: "{{ user_password }}"
        state: present
        domain_username: DOMAIN\admin-account  # Replace with actual admin account
        domain_password: SomePas2w0rd          # Replace with actual password
        domain_server: domain@DOMAIN.COM         # Replace with actual domain server
